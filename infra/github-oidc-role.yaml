AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Optional. IAM role that the GitHub Actions deploy workflow assumes through
  GitHub OIDC, so no long-lived AWS keys are stored in GitHub. It can only
  push to one ECR repository and update the estimator stack's image.

Parameters:
  GitHubOwner:
    Type: String
    Description: GitHub user or organisation that owns the repository
  GitHubRepo:
    Type: String
    Description: Repository name, e.g. affordable-housing-estimator
  Branch:
    Type: String
    Default: main
  StackName:
    Type: String
    Default: housing-estimator
  EcrRepository:
    Type: String
    Default: affordable-housing-estimator
  CreateOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Set to false if your account already has the token.actions.githubusercontent.com provider

Conditions:
  MakeProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOwner}/${GitHubRepo}:ref:refs/heads/${Branch}"
      Policies:
        - PolicyName: deploy-estimator
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EcrLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: EcrPush
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !Sub "arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${EcrRepository}"
              - Sid: UpdateStack
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:GetTemplateSummary
                Resource: !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${StackName}/*"
              - Sid: TemplateValidation
                Effect: Allow
                Action: cloudformation:ValidateTemplate
                Resource: "*"
              # A new image only changes the task definition and the service.
              - Sid: EcsUpdate
                Effect: Allow
                Action:
                  - ecs:RegisterTaskDefinition
                  - ecs:DeregisterTaskDefinition
                  - ecs:DescribeTaskDefinition
                  - ecs:UpdateService
                  - ecs:DescribeServices
                  - ecs:TagResource
                Resource: "*"
              - Sid: PassTaskRoles
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${StackName}-*"
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com

Outputs:
  DeployRoleArn:
    Description: Put this in the GitHub secret AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt DeployRole.Arn
